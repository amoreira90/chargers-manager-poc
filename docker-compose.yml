services:

  chargers-app:
    build: .
    container_name: chargers-app
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=dev
    volumes:
      - logs-data:/app/logs
    restart: unless-stopped

  loki:
    image: grafana/loki:latest
    container_name: chargers-loki
    ports:
      - "3100:3100"
    volumes:
      - ./docker/loki/loki.yml:/etc/loki/local-config.yaml
      - loki-data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    restart: unless-stopped

  promtail:
    image: grafana/promtail:latest
    container_name: chargers-promtail
    volumes:
      - ./docker/promtail/promtail.yml:/etc/promtail/config.yml
      - logs-data:/logs:ro
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki
      - chargers-app
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: chargers-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    command:
      - --config.file=/etc/prometheus/prometheus.yml
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: chargers-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  grafana-data:
  loki-data:
  logs-data:
