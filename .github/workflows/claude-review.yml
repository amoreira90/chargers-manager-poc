name: Claude Code Review

on:
  pull_request:
    branches: [develop, master]
    types: [opened, synchronize, reopened]

jobs:
  review:
    name: Claude Review
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get PR diff
        id: diff
        run: |
          git diff origin/${{ github.base_ref }}...HEAD > pr_diff.txt
          DIFF_SIZE=$(wc -c < pr_diff.txt)
          echo "diff_size=$DIFF_SIZE" >> $GITHUB_OUTPUT
          echo "PR diff size: $DIFF_SIZE bytes"

      - name: Review with Claude
        if: steps.diff.outputs.diff_size != '0'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          python3 - <<'PYEOF'
          import os, json, urllib.request

          with open("pr_diff.txt", "r", errors="replace") as f:
              diff = f.read()

          if len(diff) > 60000:
              diff = diff[:60000] + "\n... [diff truncated due to size]"

          pr_title = os.environ.get("PR_TITLE", "")
          api_key  = os.environ["ANTHROPIC_API_KEY"]

          prompt = (
              f'You are a senior software engineer reviewing a pull request titled "{pr_title}".\n\n'
              "Review the following diff and provide concise, actionable feedback in English. "
              "Structure your response with these sections (only include sections with actual findings):\n\n"
              "**🐛 Bugs & Issues** — logic errors, edge cases, exceptions not handled\n"
              "**🔒 Security** — vulnerabilities, exposed secrets, SQL injection, XSS, etc.\n"
              "**⚡ Performance** — inefficient queries, unnecessary loops, memory leaks\n"
              "**🧹 Code Quality** — naming, duplication, SOLID violations, dead code\n"
              "**✅ Suggestions** — improvements and best practices\n\n"
              "If the code looks good, say so briefly. Be constructive and concise.\n\n"
              f"Diff:\n```\n{diff}\n```"
          )

          payload = json.dumps({
              "model": "claude-3-5-sonnet-20241022",
              "max_tokens": 1500,
              "messages": [{"role": "user", "content": prompt}]
          }).encode()

          req = urllib.request.Request(
              "https://api.anthropic.com/v1/messages",
              data=payload,
              headers={
                  "x-api-key": api_key,
                  "anthropic-version": "2023-06-01",
                  "content-type": "application/json",
              },
          )

          try:
              with urllib.request.urlopen(req) as resp:
                  body = json.loads(resp.read())
          except urllib.error.HTTPError as e:
              error_body = e.read().decode()
              print(f"API error {e.code}: {error_body}")
              raise

          review = body["content"][0]["text"]

          with open("review.txt", "w") as f:
              f.write(review)

          print("Review written successfully.")
          PYEOF

      - name: Post review as PR comment
        if: steps.diff.outputs.diff_size != '0'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const review = fs.readFileSync('review.txt', 'utf8');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `## 🤖 Claude Code Review\n\n${review}\n\n---\n*Automated review by [Claude Sonnet 4.6](https://anthropic.com)*`
            });
